<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Dictionary</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Oxforder Dictionary</h1>
        
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Search for a word..." required>
            <button type="submit"> Search</button>
        </form>

        <p id="error-message" class="error"></p>

        <div id="word-details" class="word-details" style="display: none;">
            <div class="card-header">
                <h2 id="word-title"></h2>
                <button id="save-word-btn">Favorite</button>
            </div>
            <p id="word-punctuation" class="punctuation"></p>
            <button id="word-audio" class="audio-btn">🔊 Play Sound</button>
            
            <p id="word-type"><strong>Type:</strong> <span></span></p>
            <p id="word-meaning"><strong>Meaning:</strong> <span></span></p>
            <p id="word-example"><strong>Example:</strong> <span></span></p>
            <p id="word-synonyms"><strong>Synonyms:</strong> <span></span></p>
            <p id="word-antonyms"><strong>Antonyms:</strong> <span></span></p>
        </div>

        <div class="favorites-section">
            <h3>Saved Words</h3>
            <ul id="favorites-list"></ul>
        </div>
    </div>

    <audio id="audio-element"></audio>
    <script src="script.js"></script>
</body>
</html>
